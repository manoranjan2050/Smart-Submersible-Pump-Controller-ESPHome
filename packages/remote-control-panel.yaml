## ------------------------------------------------------------------------
## Pump Remote Control Panel — ESPHome package
## https://github.com/manoranjan2050/Smart-Submersible-Pump-Controller-ESPHome
##
## A standalone ESP8266 button box: press Green to start the pump, Red to
## stop it. It doesn't talk to the pump controller directly — it calls the
## pump controller's existing Start/Stop switch entities through the Home
## Assistant API, exactly like tapping the dashboard tiles would.
##
## Two onboard LEDs give at-a-glance link health:
##   - WiFi LED    : lit whenever the ESP has a WiFi connection
##   - Status LED  : lit whenever the Home Assistant API link is up (i.e.
##                   button presses will actually reach the pump)
## ------------------------------------------------------------------------

substitutions:
  name: pump-remote-panel
  friendly_name: Pump Remote Panel
  board: d1_mini

  # GPIO pin assignments (Wemos D1 Mini silkscreen labels).
  green_button_pin: D1
  red_button_pin: D2
  wifi_led_pin: D5
  status_led_pin: D6

  # Debounce time for both buttons.
  button_debounce: 20ms

  # The pump controller's switch entities to call, from Home Assistant.
  # Change these if your pump device isn't named "shop-waterpump".
  start_switch_entity_id: switch.shop_waterpump_start_pump
  stop_switch_entity_id: switch.shop_waterpump_stop_pump

  ap_password: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.8.0
  project:
    name: "electroiot.pump_remote_control_panel"
    version: "1.0.0"

esp8266:
  board: ${board}
  early_pin_init: false

logger:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "${ap_password}"
  min_auth_mode: WPA2

captive_portal:

api:
  encryption:
    key: !secret remote_panel_api_encryption_key

ota:
  - platform: esphome
    password: !secret remote_panel_ota_password

output:
  - platform: gpio
    id: wifi_led_output
    pin: ${wifi_led_pin}
  - platform: gpio
    id: status_led_output
    pin: ${status_led_pin}

binary_sensor:
  # --- Status indicators -------------------------------------------------
  - platform: template
    name: "WiFi Connected"
    id: wifi_connected
    device_class: connectivity
    lambda: |-
      return WiFi.isConnected();
    on_press:
      - output.turn_on: wifi_led_output
    on_release:
      - output.turn_off: wifi_led_output

  - platform: status
    name: "Home Assistant Connected"
    id: ha_connected
    on_press:
      - output.turn_on: status_led_output
    on_release:
      - output.turn_off: status_led_output

  # --- Physical buttons ----------------------------------------------------
  # Wire each button between its GPIO and GND; internal pullup means the pin
  # reads HIGH (released) until pressed, so `inverted: true` makes ON = pressed.
  - platform: gpio
    name: "Start Button"
    icon: "mdi:play-circle"
    pin:
      number: ${green_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: ${button_debounce}
    on_press:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: ${start_switch_entity_id}

  - platform: gpio
    name: "Stop Button"
    icon: "mdi:stop-circle"
    pin:
      number: ${red_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: ${button_debounce}
    on_press:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: ${stop_switch_entity_id}
