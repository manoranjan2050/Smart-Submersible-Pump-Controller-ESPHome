## ------------------------------------------------------------------------
## Smart Submersible Pump Controller — ESPHome package
## https://github.com/manoranjan2050/Smart-Submersible-Pump-Controller-ESPHome
##
## This file is the reusable "component". Do not edit it directly — override
## any value from your own device YAML via `substitutions:` or by redefining
## the relevant top-level key. See INSTALLATION.md for the full guide.
## ------------------------------------------------------------------------

substitutions:
  name: smart-waterpump
  friendly_name: Smart Waterpump
  board: d1_mini

  # GPIO pin assignments (Wemos D1 Mini silkscreen labels).
  start_relay_pin: D1
  stop_relay_pin: D2
  pzem_rx_pin: D5
  pzem_tx_pin: D6

  # Behaviour tuning.
  start_pulse_duration: 2.5s
  stop_pulse_duration: 2s
  dry_run_amps: "1.0"    # below this current, the motor is considered dry-running
  running_amps: "0.5"    # above this current, the motor is considered spinning
  pzem_update_interval: 2s

  # Fallback Wi-Fi hotspot broadcast if none of your networks are reachable.
  ap_password: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  # PZEM-004T support (pzemac) moved onto the modbus component; this floor
  # keeps the package from silently failing on older ESPHome installs.
  min_version: 2026.8.0
  project:
    name: "electroiot.smart_submersible_pump_controller"
    version: "1.0.0"

esp8266:
  board: ${board}
  # Prevents the relay GPIOs from flickering / ghost-triggering during boot.
  early_pin_init: false

logger:
  baud_rate: 0   # UART0 is reserved for the PZEM-004T meter, keep serial logging off

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "${ap_password}"
  min_auth_mode: WPA2

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: pzem_uart
  rx_pin: ${pzem_rx_pin}
  tx_pin: ${pzem_tx_pin}
  baud_rate: 9600

modbus:
  id: pzem_modbus
  uart_id: pzem_uart

sensor:
  - platform: pzemac
    modbus_id: pzem_modbus
    address: 1
    update_interval: ${pzem_update_interval}
    voltage:
      name: "Pump Voltage"
      id: pump_voltage
    current:
      name: "Pump Amps"
      id: pump_amps
      # Dry-run protection: if current drops below threshold while the motor
      # is registered as running, automatically pulse the stop relay.
      on_value_range:
        - below: ${dry_run_amps}
          then:
            - if:
                condition:
                  binary_sensor.is_on: pump_running_status
                then:
                  - logger.log: "Dry-run detected - auto-stopping pump"
                  - switch.turn_on: relay_stop
    power:
      name: "Pump Watts"
      id: pump_watts
    energy:
      name: "Pump Total Energy"
      id: pump_energy
    frequency:
      name: "Pump AC Frequency"
      id: pump_frequency

binary_sensor:
  - platform: template
    name: "Pump Running Status"
    id: pump_running_status
    device_class: running
    lambda: |-
      return id(pump_amps).state > ${running_amps};

switch:
  - platform: gpio
    id: relay_start
    name: "Start Pump"
    icon: "mdi:water-pump"
    pin: ${start_relay_pin}
    inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - delay: ${start_pulse_duration}
      - switch.turn_off: relay_start

  - platform: gpio
    id: relay_stop
    name: "Stop Pump"
    icon: "mdi:water-pump-off"
    pin: ${stop_relay_pin}
    inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - delay: ${stop_pulse_duration}
      - switch.turn_off: relay_stop
