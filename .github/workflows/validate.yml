name: Validate ESPHome config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-network"
          wifi_password: "ci-password"
          api_encryption_key: "Kp4vE1e2sN1uYb9wZ9nHwZ4hR6nHwZ4hR6nHwZ4hR6c="
          ota_password: "ci-ota-password"
          remote_panel_api_encryption_key: "Rm9vQmFyQmF6UXV1eEZvb0JhckJhelF1dXhGb29CYXI="
          remote_panel_ota_password: "ci-ota-password-2"
          remote_panel_wifi_ssid: "ci-network"
          remote_panel_wifi_password: "ci-password"
          remote_panel_wifi_ssid_backup: "ci-network-backup"
          remote_panel_wifi_password_backup: "ci-password-backup"
          EOF

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate pump controller example config
        run: esphome config smart-waterpump.yaml

      - name: Validate remote control panel example config (ESP8266)
        run: esphome config remote-control-panel.yaml

      - name: Validate remote control panel example config (ESP32)
        run: esphome config remote-control-panel-esp32.yaml
